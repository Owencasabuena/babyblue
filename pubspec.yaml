name: babyblue
description: "Baby Blues — Maternal Mental Health Support"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Persistent auth token storage (AES-encrypted)
  flutter_secure_storage: ^9.2.0

  # Offline mood database
  sqflite: ^2.4.0
  path: ^1.9.0

  # Utilities
  path_provider: ^2.1.0
  intl: ^0.20.0
  uuid: ^4.5.0

  # Typography
  google_fonts: ^6.2.0

  # Video playback
  video_player: ^2.9.2

  # Voice-to-text for journal
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
